<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">二項分布的常態近似與 0.5 連續性校正</title>
  <desc id="desc">二項分布 X 服從 n 等於 10、p 等於 0.5。淺藍柱表示整數機率，藍色曲線表示常態近似；虛線標示離散事件 X 大於等於 8 的界線，紅色實線標示校正後的連續界線 7.5。</desc>
  <defs>
    <style>
      .axis{stroke:#26342e;stroke-width:3;fill:none}
      .tick{stroke:#6b7771;stroke-width:1.5}
      .grid{stroke:#dce3df;stroke-width:1}
      .bar{fill:#a9dded;fill-opacity:.82;stroke:#4e7884;stroke-width:1.4}
      .curve{fill:none;stroke:#159fc7;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{fill:#26342e;font:24px "Noto Sans TC","Microsoft JhengHei",sans-serif}
      .small{fill:#52615a;font:20px "Noto Sans TC","Microsoft JhengHei",sans-serif}
      .math{fill:#26342e;font:italic 26px Georgia,serif}
      .correct{stroke:#d93444;stroke-width:5}
      .exact{stroke:#d93444;stroke-width:3;stroke-dasharray:10 8}
      .red{fill:#c92738;font:700 21px "Noto Sans TC","Microsoft JhengHei",sans-serif}
      .note{fill:#205d49;font:700 21px "Noto Sans TC","Microsoft JhengHei",sans-serif}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#26342e"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#fffef9"/>

  <line class="grid" x1="125" y1="484" x2="1080" y2="484"/>
  <line class="grid" x1="125" y1="344" x2="1080" y2="344"/>
  <line class="grid" x1="125" y1="204" x2="1080" y2="204"/>

  <line class="axis" x1="125" y1="625" x2="1095" y2="625" marker-end="url(#arrow)"/>
  <line class="axis" x1="125" y1="625" x2="125" y2="92" marker-end="url(#arrow)"/>

  <text class="math" x="1110" y="633">X</text>
  <text class="math" x="85" y="78">P(X)</text>

  <g class="small" text-anchor="end">
    <line class="tick" x1="116" y1="484" x2="134" y2="484"/><text x="104" y="491">0.1</text>
    <line class="tick" x1="116" y1="344" x2="134" y2="344"/><text x="104" y="351">0.2</text>
    <line class="tick" x1="116" y1="204" x2="134" y2="204"/><text x="104" y="211">0.3</text>
  </g>

  <g class="bar">
    <rect x="116" y="624" width="88" height="1"/>
    <rect x="204" y="611" width="88" height="14"/>
    <rect x="292" y="563" width="88" height="62"/>
    <rect x="380" y="461" width="88" height="164"/>
    <rect x="468" y="338" width="88" height="287"/>
    <rect x="556" y="280" width="88" height="345"/>
    <rect x="644" y="338" width="88" height="287"/>
    <rect x="732" y="461" width="88" height="164"/>
    <rect x="820" y="563" width="88" height="62"/>
    <rect x="908" y="611" width="88" height="14"/>
    <rect x="996" y="624" width="88" height="1"/>
  </g>

  <path class="curve" d="M145 624
    C205 621 245 612 292 586
    C340 559 380 514 424 444
    C470 371 508 310 556 278
    C584 260 616 260 644 278
    C692 310 730 371 776 444
    C820 514 860 559 908 586
    C955 612 995 621 1055 624"/>

  <g class="small" text-anchor="middle">
    <text x="160" y="660">0</text><text x="248" y="660">1</text>
    <text x="336" y="660">2</text><text x="424" y="660">3</text>
    <text x="512" y="660">4</text><text x="600" y="660">5</text>
    <text x="688" y="660">6</text><text x="776" y="660">7</text>
    <text x="864" y="660">8</text><text x="952" y="660">9</text>
    <text x="1040" y="660">10</text>
  </g>

  <line class="correct" x1="820" y1="150" x2="820" y2="625"/>
  <line class="exact" x1="864" y1="500" x2="864" y2="625"/>
  <line class="correct" x1="820" y1="700" x2="864" y2="700"/>
  <line class="correct" x1="820" y1="690" x2="820" y2="710"/>
  <line class="correct" x1="864" y1="690" x2="864" y2="710"/>
  <text class="red" x="842" y="736" text-anchor="middle">0.5</text>
  <text class="red" x="802" y="130" text-anchor="end">校正界線 7.5</text>
  <text class="red" x="880" y="485">離散界線 8</text>

  <g transform="translate(170 112)">
    <rect width="380" height="92" rx="12" fill="#f4f8f5" stroke="#d5ded9"/>
    <rect class="bar" x="18" y="18" width="34" height="25"/>
    <text class="small" x="67" y="39">二項分布的離散機率</text>
    <line class="curve" x1="18" y1="69" x2="52" y2="69"/>
    <text class="small" x="67" y="76">常態分布近似曲線</text>
  </g>
  <text class="note" x="600" y="52" text-anchor="middle">X ~ Binomial(10, 0.5)：以 P(X ≥ 8) 為例</text>
</svg>
