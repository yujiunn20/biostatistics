<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Probability density greater than one</title><desc id="desc">A uniform density with height 2 from x equals 0 to x equals 0.5. The shaded rectangular area equals 1.</desc><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#77d6b4" stop-opacity=".62"/><stop offset="1" stop-color="#77d6b4" stop-opacity=".25"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9e6df"/></marker></defs><rect width="1200" height="720" rx="28" fill="#17221d"/><g stroke="#d9e6df" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M150 590H1080"/><path d="M170 620V85"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#eaf3ee"><text x="1090" y="612" font-size="34" font-style="italic">x</text><text x="102" y="78" font-size="34" font-style="italic">f(x)</text></g><rect x="170" y="170" width="600" height="420" fill="url(#area)"/><path d="M170 590V170H770V590" fill="none" stroke="#7ee0bd" stroke-width="8" stroke-linejoin="round"/><g stroke="#a9bdb3" stroke-width="3"><path d="M157 170H183"/><path d="M770 578V602"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#eaf3ee" font-size="32"><text x="124" y="181">2</text><text x="155" y="640">0</text><text x="742" y="640">0.5</text></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="470" y="355" fill="#f1fff9" font-size="42" font-weight="700">Area = 1</text><text x="470" y="410" fill="#d6eee4" font-size="32">2 × 0.5 = 1</text><text x="470" y="505" fill="#c5ded3" font-size="27">height × width</text></g></svg>
