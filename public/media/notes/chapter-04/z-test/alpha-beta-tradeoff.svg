<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Alpha beta and power tradeoff</title><desc id="d">Null and alternative distributions with a shared critical value show Type I and Type II error regions.</desc>
<rect width="1200" height="700" rx="28" fill="#f7faf8"/>
<path d="M70 560 C130 558 175 535 230 462 C300 370 345 205 470 190 C595 205 640 370 710 462 C765 535 810 558 870 560" fill="none" stroke="#24342f" stroke-width="7"/>
<path d="M340 560 C400 558 445 535 500 462 C570 370 615 205 740 190 C865 205 910 370 980 462 C1035 535 1080 558 1140 560" fill="none" stroke="#438b72" stroke-width="7"/>
<path d="M340 560 C400 558 445 535 500 462 C550 396 588 292 630 239 L630 560 Z" fill="#31b7b2" fill-opacity=".78"/>
<path d="M630 367 C653 405 681 443 710 462 C765 535 810 558 870 560 L630 560 Z" fill="#ed6a65" fill-opacity=".82"/>
<path d="M70 560 H1140" fill="none" stroke="#70817a" stroke-width="3"/>
<path d="M630 560 V155" fill="none" stroke="#26352f" stroke-width="5" stroke-dasharray="15 11"/>
<path d="M470 560 V190 M740 560 V190" fill="none" stroke="#26352f" stroke-width="3"/>
<text x="470" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#24342f">μ₀</text>
<text x="740" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#438b72">μ₁</text>
<text x="630" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#24342f">Critical value c</text>
<text x="545" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#087f7b">β</text>
<text x="715" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#c74743">α</text>
<text x="470" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#087f7b">Type II error</text>
<text x="740" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#c74743">Type I error</text>
<text x="945" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#438b72">Power = 1 − β</text>
