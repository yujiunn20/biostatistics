    <path d="M400 328V346"/><path d="M650 328V346"/><path d="M853.3 328V346"/><path d="M863.3 328V346"/>
    <path d="M866.7 328V346"/><path d="M875 328V346"/><path d="M900 328V346"/><path d="M983.3 328V346"/>
    <path d="M1141.7 328V346"/><path d="M1250 328V346"/>
