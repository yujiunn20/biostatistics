<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Kaplan-Meier survival curves by transplant type</title>
  <desc id="desc">Step curves compare autologous and allogeneic bone marrow transplant groups over 132 months. Vertical ticks indicate right-censored observations.</desc>
  <rect width="1400" height="900" fill="#f7faf8"/>

  <text x="70" y="58" fill="#173a33" font-family="Arial, sans-serif" font-size="34" font-weight="700">Kaplan-Meier Survival by Transplant Type</text>
  <text x="70" y="91" fill="#516760" font-family="Arial, sans-serif" font-size="20">Adult bone marrow transplant cohort</text>

  <g stroke="#d8e2de" stroke-width="1">
    <path d="M150 100H1250"/><path d="M150 220H1250"/><path d="M150 340H1250"/>
    <path d="M150 460H1250"/><path d="M150 580H1250"/><path d="M150 700H1250"/>
    <path d="M150 100V700"/><path d="M250 100V700"/><path d="M350 100V700"/>
    <path d="M450 100V700"/><path d="M550 100V700"/><path d="M650 100V700"/>
    <path d="M750 100V700"/><path d="M850 100V700"/><path d="M950 100V700"/>
    <path d="M1050 100V700"/><path d="M1150 100V700"/><path d="M1250 100V700"/>
  </g>

  <path d="M150 100V700H1250" fill="none" stroke="#29453e" stroke-width="2"/>

  <g fill="#425b54" font-family="Arial, sans-serif" font-size="18" text-anchor="end">
    <text x="132" y="107">1.0</text><text x="132" y="227">0.8</text><text x="132" y="347">0.6</text>
    <text x="132" y="467">0.4</text><text x="132" y="587">0.2</text><text x="132" y="707">0.0</text>
  </g>
  <g fill="#425b54" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="150" y="731">0</text><text x="250" y="731">12</text><text x="350" y="731">24</text>
    <text x="450" y="731">36</text><text x="550" y="731">48</text><text x="650" y="731">60</text>
    <text x="750" y="731">72</text><text x="850" y="731">84</text><text x="950" y="731">96</text>
    <text x="1050" y="731">108</text><text x="1150" y="731">120</text><text x="1250" y="731">132</text>
  </g>
  <text x="700" y="784" fill="#29453e" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Months Since Transplant</text>
  <text x="45" y="405" fill="#29453e" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" transform="rotate(-90 45 405)">Survival Probability</text>

  <path d="M150 100H158.3V154.6H166.7V191.2H175V209.8H183.3V227.8H191.7V245.8H200V263.8H208.3V281.8H216.7V318.4H233.3V337H250V373H266.7V391.6H291.7V409.6H375V448H383.3V467.2H400V506.2H450V525.4H566.7V613H1250"
        fill="none" stroke="#c7583d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M150 100H158.3V128.8H166.7V157.6H175V185.8H183.3V214.6H200V242.8H208.3V271.6H250V300.4H350V337H1250"
        fill="none" stroke="#087f6d" stroke-width="5" stroke-linejoin="round"/>

